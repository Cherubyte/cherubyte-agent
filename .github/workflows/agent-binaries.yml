name: Agent binaries

# One binary per platform, so an agent installs as a native service without
# Python, a virtualenv or Docker. Each is then installed as a real service on
# the runner and pointed at a stub panel — packaging and service registration
# cannot be exercised anywhere else, and neither can the configuration path.

on:
  push:
    branches: [main]
    paths: ["agent/**", "protocol/**", ".github/workflows/agent-binaries.yml"]
  pull_request:
    paths: ["agent/**", "protocol/**", ".github/workflows/agent-binaries.yml"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    # `contents: write` so the release event can attach the built binaries.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows and macOS build a folder, so the thing published is an
          # installer rather than the executable. Linux stays a single file:
          # a shell installer and a container both want one, and it has no
          # Defender scanning every extracted library on each start.
          - os: windows-latest
            asset: CherubyteAgentSetup.exe
            binary: cherubyte-agent.exe
            layout: onedir
          - os: ubuntu-latest
            asset: cherubyte-agent-linux-x86_64
            binary: cherubyte-agent
            layout: onefile
          - os: macos-latest
            asset: cherubyte-agent-macos-arm64.tar.gz
            binary: cherubyte-agent
            layout: onedir
    runs-on: ${{ matrix.os }}
    # A step waiting for input it will never get should cost minutes, not the
    # six hours the default limit allowed.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install ./protocol
          pip install -r agent/requirements.txt
          pip install pyinstaller==6.11.1

      - name: Install pywin32
        if: runner.os == 'Windows'
        run: pip install pywin32==308

      - name: Build
        working-directory: agent/packaging
        run: pyinstaller --clean --noconfirm cherubyte-agent.spec

      # ---------------------------------------------------------------- checks

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: agent/packaging
        # iscc ships with the GitHub Windows runner image. The version comes
        # from the tag when there is one, so Add/Remove Programs shows
        # something meaningful rather than 0.0.0.
        run: |
          iscc /DAppVersion=%AGENT_VERSION% /O.. ..\windows\cherubyte-agent.iss
        env:
          AGENT_VERSION: ${{ github.event_name == 'release' && github.ref_name || '0.0.0' }}

      - name: Install and exercise the service (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: agent/packaging/dist
        run: |
          $ErrorActionPreference = 'Stop'
          # A stub panel that accepts an enrolment and any report. Proving the
          # service *starts* is not enough: the previous installer put its
          # settings in machine environment variables, which the Service
          # Control Manager does not see until a reboot — so the agent came up
          # on its defaults, never found a panel, and the old check passed
          # anyway because it only asked whether the health endpoint answered.
          $stub = Start-Job {
            Add-Type -AssemblyName System.Net.HttpListener -ErrorAction SilentlyContinue
            $l = [System.Net.HttpListener]::new()
            $l.Prefixes.Add('http://127.0.0.1:8899/')
            $l.Start()
            while ($l.IsListening) {
              $ctx = $l.GetContext()
              $path = $ctx.Request.Url.AbsolutePath
              $body = if ($path -like '*device-code*') {
                # Approved the instant it is asked for. The waiting is a person
                # clicking a button, which is not what this is checking.
                '{"code":"CI00-TEST","poll_secret":"s","verification_url":"http://127.0.0.1:8899/a/CI00-TEST","expires_in":600,"interval":2}'
              } elseif ($path -like '*device-token*') {
                '{"agent_id":7,"key":"device-key","name":"ci-runner"}'
              } elseif ($path -like '*enrol*') {
                '{"agent_id":1,"key":"k","name":"ci"}'
              } else {
                '{"ok":true,"found":0,"degraded":false,"config":{}}'
              }
              $bytes = [Text.Encoding]::UTF8.GetBytes($body)
              $ctx.Response.ContentType = 'application/json'
              $ctx.Response.OutputStream.Write($bytes, 0, $bytes.Length)
              $ctx.Response.Close()
            }
          }
          Start-Sleep -Seconds 3

          # No token: the path a person takes. -NoBrowser because a runner has
          # no desktop to open one on, and launching it would hang the job.
          #
          # This is the check that was missing. The installer required a token
          # as a mandatory parameter long after the agent had learned to enrol
          # by approval, and nothing here noticed because nothing here ever ran
          # it without one.
          ..\..\windows\install-service.ps1 -PanelUrl http://127.0.0.1:8899 `
            -Name ci-browserless -NoBrowser -ExePath (Resolve-Path .\cherubyte-agent\cherubyte-agent.exe)

          $state = Join-Path $env:ProgramData 'Cherubyte Agent\agent.json'
          if (-not (Test-Path $state)) {
            throw "Enrolling by approval left no key at $state"
          }
          $key = (Get-Content $state -Raw | ConvertFrom-Json).key
          if ($key -ne 'device-key') { throw "Wrong key stored: $key" }
          Write-Host 'Windows: enrolled by approval, key stored.'

          # Start again from nothing for the token path below.
          ..\..\windows\uninstall-service.ps1 -Purge
          Start-Sleep -Seconds 2

          ..\..\windows\install-service.ps1 -PanelUrl http://127.0.0.1:8899 `
            -EnrolToken ci-token -Name ci-runner -ExePath (Resolve-Path .\cherubyte-agent\cherubyte-agent.exe)

          # The libraries have to have travelled with the executable. A onedir
          # build copied as a single file starts, fails to load its own Python
          # runtime and registers nothing - which is exactly what happened the
          # first time this ran.
          $installed = Join-Path $env:ProgramFiles 'Cherubyte Agent'
          if (-not (Test-Path (Join-Path $installed '_internal'))) {
            throw 'The _internal folder did not travel with the executable'
          }

          $svc = Get-Service CherubyteAgent
          Write-Host "service status: $($svc.Status)"
          if ($svc.Status -ne 'Running') { throw "service did not reach Running: $($svc.Status)" }

          # The real assertion: the agent read the config file the installer
          # wrote, and enrolled. Anything less passes with a broken config path.
          $ok = $false
          foreach ($i in 1..20) {
            try {
              $r = Invoke-WebRequest http://127.0.0.1:1002/health -UseBasicParsing -TimeoutSec 3
              $j = $r.Content | ConvertFrom-Json
              Write-Host "health: $($r.StatusCode) enrolled=$($j.enrolled) last_report_ok=$($j.last_report_ok)"
              if ($j.enrolled) { $ok = $true; break }
            } catch {
              if ($_.Exception.Response) {
                $body = (New-Object IO.StreamReader($_.Exception.Response.GetResponseStream())).ReadToEnd()
                Write-Host "health (degraded): $body"
              }
            }
            Start-Sleep -Seconds 3
          }
          if (-not $ok) { throw 'the agent never enrolled — the configuration never reached the service' }

          ..\..\windows\uninstall-service.ps1 -Purge
          Stop-Job $stub -ErrorAction SilentlyContinue
          Write-Host 'Windows: installed, configured, enrolled, removed.'

      - name: Install and remove with the real installer (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: powershell
        working-directory: agent
        run: |
          $ErrorActionPreference = 'Stop'
          # The installer is what somebody double clicks, so it is the thing
          # that has to work. /VERYSILENT skips the wizard; the panel address
          # normally comes from a page, so it is written here instead.
          $setup = Resolve-Path .\CherubyteAgentSetup.exe
          Write-Host "running $setup"
          $p = Start-Process -FilePath $setup -Wait -PassThru `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOCANCEL'
          if ($p.ExitCode -ne 0) { throw "the installer exited $($p.ExitCode)" }

          $installed = Join-Path $env:ProgramFiles 'Cherubyte Agent'
          foreach ($needed in 'cherubyte-agent.exe', '_internal') {
            if (-not (Test-Path (Join-Path $installed $needed))) {
              throw "$needed is missing from $installed"
            }
          }

          $svc = Get-Service CherubyteAgent -ErrorAction SilentlyContinue
          if (-not $svc) { throw 'the installer did not register the service' }
          Write-Host "service: $($svc.Status)"

          # The binary the installer placed has to actually run. A folder build
          # missing a library starts, fails to load its own runtime and exits,
          # which a service status check alone would not catch.
          $exe = Join-Path $installed 'cherubyte-agent.exe'
          $reported = & $exe version 2>&1
          Write-Host "version says: $reported"
          if ($LASTEXITCODE -ne 0) { throw "the installed binary could not run: $reported" }

          # It appears in Add/Remove Programs, which is where somebody will
          # look to get rid of it.
          $key = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
                               'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' `
                 -ErrorAction SilentlyContinue |
                 ForEach-Object { Get-ItemProperty $_.PSPath } |
                 Where-Object { $_.DisplayName -like 'Cherubyte*' }
          if (-not $key) { throw 'no Add/Remove Programs entry' }
          Write-Host "uninstall entry: $($key.DisplayName)"

          # And it comes off again. An installer that cannot be undone is
          # worse than a script.
          $uninstall = $key.QuietUninstallString
          if (-not $uninstall) { $uninstall = $key.UninstallString + ' /VERYSILENT' }
          Write-Host "uninstalling with $uninstall"
          Start-Process -FilePath 'cmd.exe' -Wait -ArgumentList '/c', $uninstall
          Start-Sleep -Seconds 5
          if (Get-Service CherubyteAgent -ErrorAction SilentlyContinue) {
            throw 'the service survived the uninstall'
          }
          Write-Host 'Windows: installed and removed with the installer.'

      - name: Install and exercise the service (Linux)
        if: runner.os == 'Linux'
        working-directory: agent/packaging/dist
        run: |
          set -euo pipefail
          python3 -m http.server 8899 --bind 127.0.0.1 >/dev/null 2>&1 &
          # A static server is enough to prove the config arrived: the agent
          # reaches the URL from the file and reports the panel refusing it,
          # which it cannot do if it never read the file.
          sudo ../../linux/install-service.sh --panel http://127.0.0.1:8899 \
            --token ci-token --name ci-runner --binary ./cherubyte-agent
          ok=""
          for i in $(seq 1 20); do
            if sudo journalctl -u cherubyte-agent.service --no-pager | grep -q '127.0.0.1:8899'; then ok=1; break; fi
            sleep 3
          done
          # Print the evidence BEFORE asserting on it. The first version of this
          # check failed on `is-active` and exited before reaching the log dump,
          # which left a crash-looping binary with no diagnosis in the run.
          systemctl status cherubyte-agent.service --no-pager --full || true
          sudo journalctl -u cherubyte-agent.service --no-pager | tail -40 || true

          systemctl is-active --quiet cherubyte-agent.service \
            || { echo "service is $(systemctl is-active cherubyte-agent.service)" >&2; exit 1; }
          # sudo: the installer makes it 0600 root-only, because it carries the
          # enrolment token.
          sudo test -f /etc/cherubyte-agent/agent.env
          sudo grep -q '127.0.0.1:8899' /etc/cherubyte-agent/agent.env
          [ -n "$ok" ] || { echo 'the agent never contacted the configured panel' >&2; exit 1; }
          sudo ../../linux/uninstall-service.sh --purge
          echo 'Linux: installed, configured, contacted the panel, removed.'

      - name: Install and exercise the daemon (macOS)
        if: runner.os == 'macOS'
        working-directory: agent/packaging/dist
        run: |
          set -euo pipefail
          python3 -m http.server 8899 --bind 127.0.0.1 >/dev/null 2>&1 &
          # macOS is a folder build now, so the executable is one level in.
          sudo ../../macos/install-daemon.sh --panel http://127.0.0.1:8899 \
            --token ci-token --name ci-runner --binary ./cherubyte-agent/cherubyte-agent
          # the loop sleeps 3s before the first cycle, then the report round-trip
          # — poll rather than guess a single sleep on a slow runner
          ok=""
          for i in $(seq 1 20); do
            if sudo grep -q '127.0.0.1:8899' /var/log/cherubyte-agent.log 2>/dev/null; then ok=1; break; fi
            sleep 3
          done
          sudo launchctl print system/pt.qqc.cherubyte-agent | head -25 || true
          sudo tail -40 /var/log/cherubyte-agent.log || true
          sudo test -f "/Library/Application Support/Cherubyte Agent/agent.env"
          [ -n "$ok" ] || { echo 'the agent never contacted the configured panel' >&2; exit 1; }
          sudo ../../macos/uninstall-daemon.sh --purge
          echo 'macOS: installed, configured, contacted the panel, removed.'

      - name: Name the asset
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-latest)
              # iscc wrote it beside the spec directory.
              mv agent/CherubyteAgentSetup.exe "${{ matrix.asset }}"
              ;;
            macos-latest)
              # A folder cannot be a release asset, so it travels as a tarball
              # until the .pkg installer exists.
              tar -czf "${{ matrix.asset }}" -C agent/packaging/dist cherubyte-agent
              ;;
            *)
              cp "agent/packaging/dist/${{ matrix.binary }}" "${{ matrix.asset }}"
              ;;
          esac
          ls -l "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}

  # Every binary's digest in one list, signed once. An agent updating itself
  # pulls the binary from its own panel, so the panel is in the path of every
  # update — and a panel is worth compromising. The signature is what stops it
  # serving something else: the agent carries the public key compiled in, and
  # will not execute a download whose digest is not in a list this key signed.
  # Runs on every push to main, not only on a release. Signing that is only
  # ever exercised when cutting a release is signing nobody finds out is broken
  # until the moment it matters — and a release with no usable signature is one
  # no installed agent will update from. Here it just does not attach anything.
  sign:
    needs: build
    # Not on pull requests: secrets are not available to a fork's PR, so it
    # would fail for a contributor rather than telling them anything.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checked out for one reason: the verification step below reads the
      # public key out of the agent's source rather than repeating it here.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # The version compiled into the agent is what it reports, and what the
      # updater compares a release against. If the constant lags the tag, an
      # updated agent reports the old version, sees the release as newer,
      # installs it again, exits, restarts and never stops — so a mismatch
      # fails the release rather than shipping it.
      - name: The tag and the compiled-in version must agree
        if: github.event_name == 'release'
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          compiled=$(grep -oP 'AGENT_VERSION = "\K[^"]+' agent/cherubyte_agent/reporter.py)
          echo "tag=$tag compiled=$compiled"
          if [ "$tag" != "$compiled" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match AGENT_VERSION $compiled." >&2
            echo "An agent built here would report $compiled, see $tag as newer, and" >&2
            echo "reinstall it on every restart. Bump the constant or retag." >&2
            exit 1
          fi

      - name: List the digests
        working-directory: assets
        run: sha256sum cherubyte-agent-* > ../SHA256SUMS

      - name: Sign the list
        env:
          SIGNING_KEY: ${{ secrets.CHERUBYTE_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "CHERUBYTE_RELEASE_SIGNING_KEY is not set." >&2
            echo "An unsigned release is one no agent will install, so this fails" >&2
            echo "rather than publishing binaries that cannot be verified." >&2
            exit 1
          fi
          pip install --quiet "cryptography==50.0.1"
          python - <<'PY'
          import base64, os
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          key = Ed25519PrivateKey.from_private_bytes(
              base64.b64decode(os.environ["SIGNING_KEY"])
          )
          sums = open("SHA256SUMS", "rb").read()
          open("SHA256SUMS.sig", "wb").write(key.sign(sums))
          print(sums.decode())
          PY

      - name: Check it against the key the agent carries
        run: |
          python - <<'PY'
          import base64, re, sys
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey

          # Read the constant out of the source rather than repeating it here,
          # so a rotated key that was not propagated fails the build instead of
          # shipping a release no installed agent can verify.
          source = open("agent/cherubyte_agent/release_key.py").read()
          pub = re.search(r'RELEASE_PUBLIC_KEY = "([^"]+)"', source).group(1)
          Ed25519PublicKey.from_public_bytes(base64.b64decode(pub)).verify(
              open("SHA256SUMS.sig", "rb").read(), open("SHA256SUMS", "rb").read()
          )
          print("The signature verifies against the key compiled into the agent.")
          PY
      # The installers go with the binaries. A release that is three bare
      # executables leaves somebody to find the install script in the
      # repository, which is one step too many and the reason the first
      # Windows install was done by double-clicking the exe.
      - name: Attach the digests, the signature and the installers
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SHA256SUMS
            SHA256SUMS.sig
            agent/windows/install-service.ps1
            agent/windows/uninstall-service.ps1
            agent/linux/install-service.sh
            agent/macos/install-daemon.sh
