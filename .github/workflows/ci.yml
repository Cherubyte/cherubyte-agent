name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements-dev.txt
      - name: Install dependencies
        working-directory: agent
        run: |
          pip install ../protocol
          pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: agent
        run: pytest -q
