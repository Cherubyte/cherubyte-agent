name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements-dev.txt
      - name: Install dependencies
        working-directory: agent
        run: |
          pip install ../protocol
          pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: agent
        run: pytest -q

  protocol-drift:
    # The vendored protocol/ must stay byte-identical to the commit it is
    # pinned to in Cherubyte/cherubyte (protocol/UPSTREAM). A wire change that
    # landed on only one side fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-sync from the pinned upstream and check for drift
        run: |
          ./scripts/sync-protocol.sh
          git diff --exit-code -- protocol \
            || { echo "::error::protocol/ has drifted from protocol/UPSTREAM — run scripts/sync-protocol.sh"; exit 1; }
